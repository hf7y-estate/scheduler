# TRAP 1 -- PARK, NEVER DELETE. Verified 2026-08-06, see witness below.
#
# HISTORY, not a live mechanism: this trap described fixed-cron suppression,
# which keyed on rotation MEMBERSHIP, not on the enabled flag (lib/paced-conf.sh,
# paced_membership_set; bin/sync-crontab.sh's is_paced, gated by
# PACED_SUPPRESS_BATCH=1 in schedule/_runner.conf). Deleting a row used to ARM
# an auto-staggered fixed nightly BATCH cron line for that project on the next
# `sync-crontab.sh --apply`; commenting a row out had the same effect, because
# paced_membership_set skips `#`-prefixed names on purpose. sync-crontab.sh
# retired 2026-09-02 (#454/#488) and nothing installs a per-project cron line
# any more, so that specific hazard cannot recur.
#
# What a row in THIS file still does today: bin/usage-paced-runner.sh's
# dispatch loop iterates names straight out of $PACED_CONF, and only a listed
# name ever reaches `participant_enabled` -- which is schedule/ROSTER, and
# ROSTER alone, deciding whether to dispatch (#282, #364;
# bin/usage-paced-runner.sh:182-203). The `enabled` column parsed from this
# file's rows is not consulted by that check (bin/usage-paced-runner.sh:630-633)
# -- deleting or commenting out a row still removes a project from this host's
# candidate list, but flipping `enabled` alone no longer does anything. That
# gap between what this file's `enabled` column implies and what actually
# gates dispatch now is not resolved here -- filed as #772.
#
# WITNESS: tests/sync-crontab-paced-witness.sh, case "membership decides
# suppression, across every host's rotation" -- HISTORY: that witness was
# deleted along with sync-crontab.sh itself in #488 (README.md notes the same
# deletion), so there is no live test to point a reader at for this trap.
#
# THE ONE SAFE WAY TO DELETE A ROW, AT THE TIME: delete schedule/<name>.conf in
# the SAME change, because sync-crontab.sh's project glob read schedule/*.conf
# and with no conf there was no entry left to re-arm. That is how the
# 2026-08-01 unregistration of twelve rows was done safely under that
# mechanism; sync-crontab.sh is gone, so there is nothing left to preview with
# `./bin/sync-crontab.sh`.
#
# TRAP 2 -- MEMBERSHIP IS A UNION across schedule/_paced.conf AND every
# schedule/_paced.<host>.conf (paced_membership_set, lib/paced-conf.sh:128).
# "Does the paced system own this project?" is an ecosystem-wide question and
# reads ecosystem-wide; "does it dispatch HERE, right now?" is host-local and
# reads resolve_paced_conf.
#
# HISTORY, not a live mechanism: answering the first per-host used to arm a
# fixed nightly cron line, via sync-crontab.sh, on every host that did not
# list the project -- that bug was live on 2026-07-29 and is why the union
# exists. sync-crontab.sh retired 2026-09-02 (#454/#488) and nothing installs
# a per-project cron line any more (bin/rotation-lint.sh:16: "it arms nothing
# now"), so that specific hazard cannot recur -- same conclusion TRAP 1 above
# reaches. The union itself is unchanged and still the monotonically safe
# direction: it can only ever suppress a line, never arm one.
